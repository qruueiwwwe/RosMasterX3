apiVersion: apps/v1
kind: Deployment
metadata:
  name: ros1-driver
  namespace: deviceshifu
  labels:
    app: ros1-driver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ros1-driver
  template:
    metadata:
      labels:
        app: ros1-driver
    spec:
      containers:
      - name: ros1-driver
        image: driver_ros1:v1  # 替换为你的镜像名称
        command: ["python3", "/app/driver_ros1.py"]  # 启动命令
        env:
        - name: ROS_MASTER_URI
          value: "http://宿主机IP:11311"  # 替换为实际宿主机IP
        ports:
        - containerPort: 8081  # 与 EdgeDevice 的 ListenPort 一致