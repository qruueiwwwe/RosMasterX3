apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-ros1
  labels:
    app: driver-ros1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-ros1
  template:
    metadata:
      labels:
        app: driver-ros1
    spec:
      containers:
      - name: driver-ros1
        image: driver_ros1:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ROS_MASTER_URI
          value: "http://宿主机IP:11311"
        - name: ROS_IP
          value: "宿主机IP"
        - name: ROS_DISTRO
          value: "noetic"
        - name: PYTHONPATH
          value: "/opt/ros/noetic/lib/python3/dist-packages"
        - name: LD_LIBRARY_PATH
          value: "/opt/ros/noetic/lib"
        - name: ROS_PACKAGE_PATH
          value: "/opt/ros/noetic/share"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        volumeMounts:
        - name: ros1-config
          mountPath: /app/config
      volumes:
      - name: ros1-config
        configMap:
          name: ros1-config