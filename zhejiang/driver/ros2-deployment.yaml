apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-ros2
  labels:
    app: driver-ros2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driver-ros2
  template:
    metadata:
      labels:
        app: driver-ros2
    spec:
      containers:
      - name: driver-ros2
        image: driver_ros2:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: ROS_DOMAIN_ID
          value: "0"
        - name: ROS_LOCALHOST_ONLY
          value: "0"
        - name: ROS_DISTRO
          value: "foxy"
        - name: PYTHONPATH
          value: "/opt/ros/foxy/lib/python3.8/site-packages"
        - name: LD_LIBRARY_PATH
          value: "/opt/ros/foxy/lib"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: ros2-config
          mountPath: /app/config
      volumes:
      - name: ros2-config
        configMap:
          name: ros2-config