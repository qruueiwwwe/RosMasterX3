apiVersion: shifu.edgenesis.io/v1alpha1
kind: EdgeDevice
metadata:
  name: ros2-driver
  namespace: deviceshifu
spec:
  sku: "ROS2-Driver"
  connection: Ethernet
  address: "0.0.0.0:11112"  # 这里需要根据你的实际ROS2 domain ID修改
  protocol: HTTP
  protocolSettings:
    TCPSetting:
      ListenPort: "8081"
      NetworkType: "tcp"
  customMetadata:
    ROS_DOMAIN_ID: "0"
    ROS_LOCALHOST_ONLY: "0" 