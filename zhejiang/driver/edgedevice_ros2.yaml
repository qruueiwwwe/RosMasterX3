apiVersion: shifu.edgenesis.io/v1alpha1
kind: EdgeDevice
metadata:
  name: ros2-driver
  namespace: deviceshifu
spec:
  sku: "ROS2-Driver"
  connection: Ethernet
  address: "宿主机IP:8080"  # 替换为实际宿主机IP
  protocol: HTTP
  protocolSettings:
    TCPSetting:
      ListenPort: "8081"
      NetworkType: "tcp"
  customMetadata:
    ROS_DOMAIN_ID: "0"
    ROS_LOCALHOST_ONLY: "0"