apiVersion: shifu.edgenesis.io/v1alpha1
kind: EdgeDevice
metadata:
  name: ros1-driver
  namespace: deviceshifu
spec:
  sku: "ROS1-Driver"
  connection: Ethernet
  address: "宿主机IP:11311"  # 替换为实际宿主机IP
  protocol: HTTP
  protocolSettings:
    TCPSetting:
      ListenPort: "8081"
      NetworkType: "tcp"
  customMetadata:
    ROS_MASTER_URI: "http://宿主机IP:11311"
    ROS_IP: "宿主机IP"