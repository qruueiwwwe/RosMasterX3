apiVersion: shifu.edgenesis.io/v1alpha1
kind: EdgeDevice
metadata:
  name: ros1-driver
  namespace: deviceshifu
spec:
  sku: "ROS1-Driver"
  connection: Ethernet
  address: "0.0.0.0:11112"  # 这里需要根据你的实际ROS master地址修改
  protocol: HTTP
  protocolSettings:
    HTTPSetting:
      ContentType: "application/json"
      TimeoutInMilliseconds: 5000
  customInstructions: |
    - name: "start"
      description: "启动ROS1驱动"
      type: "command"
    - name: "stop"
      description: "停止ROS1驱动"
      type: "command"
    - name: "status"
      description: "获取驱动状态"
      type: "command"
  instructions:
    - name: "start"
      description: "启动ROS1驱动"
      type: "command"
    - name: "stop"
      description: "停止ROS1驱动"
      type: "command"
    - name: "status"
      description: "获取驱动状态"
      type: "command"
  telemetries:
    - name: "connection_status"
      description: "连接状态"
      type: "string"
    - name: "robot_status"
      description: "机器人状态"
      type: "string" 