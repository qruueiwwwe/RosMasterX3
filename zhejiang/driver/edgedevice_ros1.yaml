apiVersion: shifu.edgenesis.io/v1alpha1
kind: EdgeDevice
metadata:
  name: ros1-driver
  namespace: deviceshifu
spec:
  sku: "ROS1-Driver"
  connection: Ethernet
  address: "宿主机IP:11311"  # 替换为实际宿主机IP（如 192.168.1.100）
  protocol: HTTP
  protocolSettings:
    TCPSetting:
      ListenPort: "8081"  # 驱动容器监听的端口
      NetworkType: "tcp"
  customMetadata:
    ROS_MASTER_URI: "http://宿主机IP:11311"  # 替换为实际宿主机IP
    ROS_IP: "宿主机IP"  # 驱动容器的IP（可留空，由集群自动分配）
  driver:  # 新增驱动容器配置
    image: driver_ros1:latest  # 镜像名称
    command: ["python3", "/app/driver_ros1.py"]  # 启动命令
    env:  # 可选环境变量（根据需要添加）
      - name: ROS_MASTER_URI
        value: "http://宿主机IP:11311"