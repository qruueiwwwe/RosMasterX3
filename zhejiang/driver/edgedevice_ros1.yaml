apiVersion: shifu.edgenesis.io/v1alpha1
kind: EdgeDevice
metadata:
  name: ros1-driver
  namespace: kind
spec:
  sku: "ROS1-Driver"
  connection: Ethernet
  address: "0.0.0.0:11112"  # 这里需要根据你的实际ROS master地址修改
  protocol: HTTP
  protocolSettings:
    TCPSetting:
      ListenPort: "8081"
      NetworkType: "tcp"
  customMetadata:
    ROS_MASTER_URI: "http://0.0.0.0:11311"
    ROS_IP: "0.0.0.0" 